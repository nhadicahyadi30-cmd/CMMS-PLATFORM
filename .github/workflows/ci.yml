name: CI
on: [push, pull_request]
jobs:
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: psql -c "create database mh_test"
      - run: for f in db/migrations/*.sql; do psql -d mh_test -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: psql -d mh_test -v ON_ERROR_STOP=1 -q -f db/seed/dev_seed.sql
      - run: psql -d mh_test -v ON_ERROR_STOP=1 -q -f db/tests/rls_and_workflow.sql
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd apps/api && npm ci && npm run build && npm test --if-present
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd apps/web && npm ci && npm run build
