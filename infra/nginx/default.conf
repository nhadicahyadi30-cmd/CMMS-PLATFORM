# Docker DNS tertanam. Alamat api/web di-resolve ulang tiap 10 detik, jadi setelah
# `docker compose up -d --build api` (IP container berubah) tidak perlu restart nginx.
# Variabel di proxy_pass memaksa nginx me-resolve saat request, bukan hanya saat start.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  client_max_body_size 25m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # TLS: pasang sertifikat (Let's Encrypt/ACM) lalu arahkan 80 -> 443 di lingkungan produksi.
  location /api/ {
    set $api_upstream http://api:3001;
    # buang awalan /api (query string tetap ikut); dengan variabel, proxy_pass tidak boleh membawa URI
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
