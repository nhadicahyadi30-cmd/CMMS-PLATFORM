# Portabel: VPS, cloud, atau on-prem. Jalankan: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    networks: [internal]
  migrate:
    image: postgres:16
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes: [./db:/db:ro, ./infra/scripts/migrate.sh:/migrate.sh:ro]
    entrypoint: ["bash", "/migrate.sh"]
    networks: [internal]
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}          # jam backup harian (waktu server/UTC)
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${BACKUP_TZ:-Asia/Jakarta}
    volumes: [./backups:/backups, ./infra/scripts/backup-loop.sh:/backup-loop.sh:ro]
    entrypoint: ["bash", "/backup-loop.sh"]
    networks: [internal]
  minio:
    image: pgsty/minio   # fork komunitas MinIO (image resmi minio/minio sudah dihentikan); untuk produksi, pertimbangkan S3 terkelola
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]
    networks: [internal]
  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    env_file: .env
    environment:
      DATABASE_URL: postgres://maintainhub_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_DATABASE_URL: postgres://maintainhub_auth:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    networks: [internal]
  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    networks: [internal]
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on: [api, web]
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs
    networks: [internal]
  # ---- Jalur IoT (opsional): docker compose --profile iot up -d ----
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [iot]
    restart: unless-stopped
    environment: { MQTT_USER: "${MQTT_USER:-}", MQTT_PASS: "${MQTT_PASS:-}" }
    command:
      - sh
      - -c
      - |
        if [ -z "$$MQTT_USER" ] || [ -z "$$MQTT_PASS" ]; then echo "Isi MQTT_USER dan MQTT_PASS di .env lalu jalankan ulang"; exit 1; fi
        mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASS" && chown mosquitto:mosquitto /mosquitto/data/passwd 2>/dev/null; chmod 0700 /mosquitto/data/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports: ["1883:1883"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
    networks: [internal]
  nodered:
    image: nodered/node-red:4
    profiles: [iot]
    restart: unless-stopped
    depends_on: [mosquitto, nginx]
    environment:
      TZ: Asia/Jakarta
      MAINTHUB_URL: http://nginx
      MAINTHUB_KEY: "${NODERED_MAINTHUB_KEY:-}"   # opsional: kunci cadangan bila perangkat tidak membawa kunci sendiri
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1884"
    # Editor Node-RED tanpa login: hanya dibuka di komputer ini (127.0.0.1). Jangan dipublikasikan ke jaringan.
    ports: ["127.0.0.1:1880:1880"]
    volumes:
      - noderedata:/data
      - ./tools/nodered:/seed:ro
    entrypoint: ["/bin/sh", "-c", "[ -f /data/flows.json ] || node /seed/seed.js; exec ./entrypoint.sh"]
    networks: [internal]
volumes: { pgdata: {}, miniodata: {}, certs: {}, mqttdata: {}, noderedata: {} }
networks: { internal: {} }
