# Broker MQTT MaintHub (profil Docker "iot").
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Untuk perangkat RTU di jaringan pabrik: WAJIB user + password (dibuat dari MQTT_USER / MQTT_PASS di .env).
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

# Khusus container lain di jaringan Docker internal (Node-RED). Port ini TIDAK dipublikasikan ke host.
listener 1884
allow_anonymous true
